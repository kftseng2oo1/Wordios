<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WordiOS · Doc2MD</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      max-width: 820px;
      margin-inline: auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 34px; height: 34px; border-radius: 8px; }
    .brand h1 { font-size: 1.15rem; margin: 0; }
    .dropzone {
      margin-top: 14px;
      border: 1.5px dashed var(--border);
      background: var(--panel);
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
    }
    .dropzone.dragover { border-color: var(--accent); background: #132338; }
    .dropzone p { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
      align-items: center;
    }
    button {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #090c10;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.active { border-color: var(--accent); color: var(--accent); }
    .status { font-size: 0.85rem; color: var(--muted); margin-left: auto; }
    textarea, .preview {
      width: 100%;
      min-height: 320px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
    }
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }
    .preview { white-space: pre-wrap; }
    .settings {
      margin-top: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: none;
    }
    .settings.open { display: block; }
    .settings label { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
    .settings input {
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="./icon.svg" alt="WordiOS Icon" />
      <h1>WordiOS · 轉 Markdown</h1>
    </div>
    <button id="toggleSettingsBtn" type="button">API 設定</button>
  </header>

  <section id="settingsPanel" class="settings">
    <strong>轉檔後端設定（本機儲存）</strong>
    <label>
      Convert API 網址（例如 https://your-domain/convert）
      <input id="apiUrlInput" type="url" placeholder="https://your-doc2md-api.example.com/convert" />
    </label>
    <label>
      X-API-Key（選填）
      <input id="apiKeyInput" type="password" placeholder="輸入你的 API Key" />
    </label>
    <div style="margin-top: 10px;">
      <button id="saveSettingsBtn" class="primary" type="button">儲存設定</button>
    </div>
  </section>

  <div id="dropzone" class="dropzone">
    <strong>點此選擇或拖曳 Word / Excel / PPT / PDF 檔案</strong>
    <p>支援 .doc, .docx, .xls, .xlsx, .ppt, .pptx, .pdf</p>
    <input id="fileInput" type="file" accept=".doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf,application/pdf" hidden />
  </div>

  <div class="toolbar">
    <button id="modeSourceBtn" class="active" type="button">原始碼</button>
    <button id="modePreviewBtn" type="button">純文字預覽</button>
    <button id="copyBtn" class="primary" type="button">一鍵複製</button>
    <button id="downloadBtn" type="button">下載 .md</button>
    <span id="statusText" class="status">就緒</span>
  </div>

  <textarea id="mdEditor" placeholder="轉換後的 Markdown 會顯示在這裡..."></textarea>
  <div id="mdPreview" class="preview" hidden></div>

  <script>
    const KEY_URL = "wordios_api_url";
    const KEY_SECRET = "wordios_api_key";

    const apiUrlInput = document.getElementById("apiUrlInput");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const settingsPanel = document.getElementById("settingsPanel");
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const mdEditor = document.getElementById("mdEditor");
    const mdPreview = document.getElementById("mdPreview");
    const statusText = document.getElementById("statusText");
    const modeSourceBtn = document.getElementById("modeSourceBtn");
    const modePreviewBtn = document.getElementById("modePreviewBtn");

    let currentBaseName = "converted";

    apiUrlInput.value = localStorage.getItem(KEY_URL) || "";
    apiKeyInput.value = localStorage.getItem(KEY_SECRET) || "";

    document.getElementById("toggleSettingsBtn").addEventListener("click", () => {
      settingsPanel.classList.toggle("open");
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      localStorage.setItem(KEY_URL, apiUrlInput.value.trim());
      localStorage.setItem(KEY_SECRET, apiKeyInput.value.trim());
      settingsPanel.classList.remove("open");
      statusText.textContent = "已儲存 API 設定";
    });

    function setMode(mode) {
      const isSource = mode === "source";
      mdEditor.hidden = !isSource;
      mdPreview.hidden = isSource;
      modeSourceBtn.classList.toggle("active", isSource);
      modePreviewBtn.classList.toggle("active", !isSource);
      if (!isSource) {
        mdPreview.textContent = mdEditor.value;
      }
    }

    modeSourceBtn.addEventListener("click", () => setMode("source"));
    modePreviewBtn.addEventListener("click", () => setMode("preview"));

    document.getElementById("copyBtn").addEventListener("click", async () => {
      if (!mdEditor.value) return;
      try {
        await navigator.clipboard.writeText(mdEditor.value);
        statusText.textContent = "已複製到剪貼簿";
      } catch {
        mdEditor.select();
        document.execCommand("copy");
        statusText.textContent = "已複製";
      }
    });

    document.getElementById("downloadBtn").addEventListener("click", () => {
      if (!mdEditor.value) return;
      const blob = new Blob([mdEditor.value], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${currentBaseName}.md`;
      a.click();
      URL.revokeObjectURL(url);
    });

    async function handleFile(file) {
      if (!file) return;
      const endpoint = (localStorage.getItem(KEY_URL) || apiUrlInput.value).trim();
      const apiKey = (localStorage.getItem(KEY_SECRET) || apiKeyInput.value).trim();

      currentBaseName = file.name.replace(/\.[^.]+$/, "") || "converted";

      if (!endpoint) {
        statusText.textContent = "請先點右上角「API 設定」填入後端網址";
        settingsPanel.classList.add("open");
        return;
      }

      statusText.textContent = `正在上傳 ${file.name}...`;
      const formData = new FormData();
      formData.append("file", file, file.name);

      try {
        const headers = {};
        if (apiKey) headers["X-API-Key"] = apiKey;

        const resp = await fetch(endpoint, {
          method: "POST",
          headers,
          body: formData
        });
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}`);
        }
        const data = await resp.json();
        mdEditor.value = data.markdown || "";
        if (!mdPreview.hidden) {
          mdPreview.textContent = mdEditor.value;
        }
        statusText.textContent = `完成 (${data.engine || "api"})`;
      } catch (err) {
        statusText.textContent = `轉換失敗：${err.message}`;
      }
    }

    dropzone.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => handleFile(e.target.files?.[0]));

    ["dragenter", "dragover"].forEach((ev) => {
      dropzone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach((ev) => {
      dropzone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
      });
    });

    dropzone.addEventListener("drop", (e) => {
      const file = e.dataTransfer?.files?.[0];
      handleFile(file);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
